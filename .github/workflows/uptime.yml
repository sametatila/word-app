# DIŞ İZLEME — sunucudan BAĞIMSIZ bekçi, GÜNLÜK YEDEK.
#
# Sunucudaki uyarı motoru (lib/alerts) ve bekçi (/opt/lernomi/watchdog.sh) aynı
# makinede çalışıyor: makine tamamen düşerse (Netcup arızası, ağ kesintisi,
# disk) ikisi de susar ve kimse haber vermez. Dışarıdan yoklama 2026-09-24'ten
# beri UptimeRobot'ta (ücretsiz plan, /api/config 5 dakikada bir, bildirim
# Samet'in e-postası ve UptimeRobot mobil uygulaması; hesap Samet'te).
#
# NEDEN ARTIK GÜNDE BİR: bu iş 5 dakikada bir koşuyordu ama GitHub zamanlaması
# fiilen 2-7 saatte bir tetikliyordu (denetim TEC-3), yani kesinti saatler sonra
# duyuluyordu; depo private olunca da her koşu en az 1 dakika sayılıp ayda
# ~8.640 dakika yiyecekti (ücretsiz kota 2.000). Günde bir koşu ayda ~30 dakika
# ve UptimeRobot'un ücretsiz planında olmayan sertifika süresini ölçüyor.
#
# NE YAPIYOR (günde bir, 06:17 UTC; elle de tetiklenebilir):
#   - /api/config HTTP 200 mü (3 deneme, 20 sn arayla - tek hıçkırık alarm değil),
#     asıl adreste ve mobilin yedek adresinde (lernomi.rumpuskit.com; engelli
#     ağlarda tek yol, sunucudaki bekçi de yokluyor)
#   - HTTPS sertifikası 10 günden az mı kaldı (iki adres)
#   - alan adlarının kaydı 30 günden az mı kaldı (lernomi.app, rumpuskit.com; RDAP)
#   - Telegram jetonu geçerli mi (getMe): jeton iptal olursa sunucudaki bütün
#     uyarılar sessizce düşer; bu iş o zaman kırmızı biter ve GitHub e-postası
#     tek haber yolu olur
# SORUN VARSA:
#   - Telegram'a yazar: kesinti BAŞLADIĞINDA hemen, sürerse sonraki koşularda,
#     düzelince bir kez. Durum (ne zamandan beri kapalı, son mesaj) Actions önbelleğinde.
#   - İş kırmızı biter: GitHub sahibine e-posta atar (Telegram kurulmamışsa da
#     haber alınır).
# Gizliler: repo › Settings › Secrets › TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# (yoksa yalnız e-posta). Depo herkese açık: bu dosyada sır yok.
name: Dış izleme

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Telegram'a deneme mesajı gönder (gizlilerin çalıştığını doğrulamak için)"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Önceki durum
        uses: actions/cache/restore@v4
        with:
          path: uptime-state
          key: uptime-state-${{ github.run_id }}
          restore-keys: uptime-state-

      - name: Siteyi ve sertifikayı yokla
        id: probe
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -u
          mkdir -p uptime-state
          # Her mesaj nereye bakılacağını ADRESİYLE söylüyor: bu koşunun kaydı,
          # yoklanan uç ve (site açıksa) panelin sunucu bölümü.
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NL=$'\n'
          WHERE="Koşu: $RUN_URL | Yoklanan: https://www.lernomi.app/api/config | Panel (açılınca): https://www.lernomi.app/admin/ops"
          send() {
            [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ] && return 0
            curl -sS --max-time 10 -o /dev/null \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=Lernomi (dış izleme) — $1${NL}${WHERE}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" || true
          }
          if [ "${{ inputs.test }}" = "true" ]; then
            send "Deneme 3/3: dış izleme (GitHub Actions). Site dışarıdan yoklanıyor; sunucu tamamen düşse de bu yol çalışır."
          fi
          now=$(date +%s)
          down_since=$(cat uptime-state/down_since 2>/dev/null || echo "")
          last_sent=$(cat uptime-state/last_sent 2>/dev/null || echo 0)

          probe_host() {  # $1 host → HTTP kodu (3 deneme)
            local c=000 i
            for i in 1 2 3; do
              # Bağlantı hatasında -w zaten 000 basıyor ("|| echo 000" 000000 yapardı).
              c=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$1/api/config") || true
              [ "$c" = "200" ] && break
              sleep 20
            done
            echo "$c"
          }
          code=$(probe_host www.lernomi.app)
          alt_code=$(probe_host lernomi.rumpuskit.com)

          problem=""
          if [ "$code" != "200" ]; then
            problem="[KRİTİK] Site dışarıdan erişilemiyor: /api/config HTTP $code (3 deneme)."
          fi
          if [ "$alt_code" != "200" ]; then
            problem="${problem:+$problem }[KRİTİK] Yedek adres (lernomi.rumpuskit.com, engelli ağlarda mobilin tek yolu) erişilemiyor: HTTP $alt_code."
          fi

          for host in www.lernomi.app lernomi.rumpuskit.com; do
            end=$(echo | timeout 15 openssl s_client -servername "$host" -connect "$host:443" 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
            if [ -n "$end" ]; then
              days=$(( ( $(date -d "$end" +%s) - now ) / 86400 ))
              echo "sertifika $host: $days gün"
              if [ "$days" -lt 10 ]; then
                problem="${problem:+$problem }[KRİTİK] HTTPS sertifikası ($host) $days gün içinde bitiyor."
              fi
            fi
          done

          # Alan adı kaydı: süresi dolarsa site ve e-posta birden gider; kayıt
          # firmasının otomatik yenilemesi kart sorununda sessizce düşebiliyor.
          for dom in lernomi.app rumpuskit.com; do
            # RDAP JSON dönmezse (429, HTML) jq düşer; adım (bash -e) yarıda kalmasın,
            # öncesinde bulunan gerçek sorun Telegram'a yine gitsin.
            exp=$(curl -s --max-time 15 -L "https://rdap.org/domain/$dom" | jq -r '[.events[]? | select(.eventAction == "expiration") | .eventDate][0] // empty' 2>/dev/null) || exp=""
            if [ -n "$exp" ]; then
              ddays=$(( ( $(date -d "$exp" +%s) - now ) / 86400 ))
              echo "alan adı $dom: $ddays gün"
              if [ "$ddays" -lt 30 ]; then
                problem="${problem:+$problem }[KRİTİK] Alan adı $dom kaydı $ddays gün içinde bitiyor: kayıt firmasında yenile."
              fi
            else
              echo "alan adı $dom: RDAP okunamadı (uyarı yok)"
            fi
          done

          if [ -n "$problem" ]; then
            if [ -z "$down_since" ]; then
              echo "$now" > uptime-state/down_since
              send "$problem"
              echo "$now" > uptime-state/last_sent
            elif [ $(( now - last_sent )) -ge 3600 ]; then
              send "[SÜRÜYOR $(( (now - down_since) / 60 )) dk] $problem"
              echo "$now" > uptime-state/last_sent
            fi
            echo "$problem"
            echo "failed=1" >> "$GITHUB_OUTPUT"
          else
            if [ -n "$down_since" ]; then
              send "[DÜZELDİ] Site dışarıdan yeniden erişilebilir ($(( (now - down_since) / 60 )) dk sonra)."
            fi
            rm -f uptime-state/down_since uptime-state/last_sent
            echo "tamam: HTTP $code"
          fi

      - name: Telegram jetonu geçerli mi
        id: tg
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          [ -z "${TELEGRAM_BOT_TOKEN}" ] && { echo "Telegram gizlisi yok"; exit 0; }
          ok=$(curl -s --max-time 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | jq -r '.ok // false')
          if [ "$ok" != "true" ]; then
            echo "::error::Telegram jetonu reddedildi (getMe): sunucudaki uyarı motoru, bekçi ve deploy uyarıları da gitmiyor. BotFather'dan yeni jeton al; sunucu .env, yerel .secrets/telegram/ ve GitHub gizlilerini birlikte güncelle, rolling restart."
            echo "failed=1" >> "$GITHUB_OUTPUT"
          else
            echo "Telegram jetonu geçerli"
          fi

      - name: Durumu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: uptime-state
          key: uptime-state-${{ github.run_id }}

      - name: Sorun varsa kırmızı bit (GitHub e-postası)
        if: steps.probe.outputs.failed == '1' || steps.tg.outputs.failed == '1'
        run: exit 1
