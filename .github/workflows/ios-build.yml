# iOS derleme doğrulaması — Apple Developer hesabı GEREKMEZ.
#
# Ayrım şu: derleme ile imzalama ayrı şeyler. Simülatör hedefine derlemek imza
# istemez, dolayısıyla hesap açılmadan da Swift'in derlendiği, köprünün doğru
# kurulduğu ve Pod'ların çözüldüğü bugün doğrulanabiliyor. Cihaz imzası, .ipa ve
# TestFlight ücretli hesap ister; onlar bu iş akışında yok.
#
# Depo public olduğu için standart runner'lar (macOS dâhil) ücretsiz ve
# dakika sınırı yok.
#
# NE DOĞRULAR: derleniyor mu.
# NE DOĞRULAMAZ: çalışıyor mu. Ekran kapalıyken yürüyüş modunun ses oturumu
# gerçek cihaz ister — kilit ekranı davranışı simülatörde anlamlı sınanamaz
# (bkz. docs/appstore/README.md).

name: iOS derleme

on:
  push:
    paths: ["mobile/ios/**", "mobile/src/**", "mobile/package.json", "mobile/package-lock.json", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["mobile/ios/**", "mobile/src/**", "mobile/package.json", "mobile/package-lock.json"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/package.json
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Bağımlılıklar
        working-directory: mobile
        run: npm ci

      # patch-package yamaları postinstall'da uygulanıyor; Pod'lar yamalı
      # kaynağı görmeli, o yüzden pod install'dan ÖNCE.
      - name: TypeScript
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Pods önbelleği
        uses: actions/cache@v4
        with:
          path: mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('mobile/ios/Podfile.lock', 'mobile/package-lock.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: pod install
        working-directory: mobile/ios
        run: pod install --repo-update

      # UI test hedefi projede yok; burada ekleniyor. Sebep: geliştirme makinesi
      # Linux ve orada Ruby yok, yani xcodeproj gem'i yerelde koşturulamıyor.
      # Elle pbxproj yazmak on nesne türü ve uydurma UUID demek olurdu. Betik
      # fikirsiz: hedef zaten varsa dokunmuyor.
      #
      # pod install'dan SONRA: önce denendi ve CocoaPods projeyi kendisi yeniden
      # yazdığı için hedef bozuk çıktı. Workspace yalnız projeye başvuruyor,
      # sonradan hedef eklemek onu bozmuyor.
      - name: UI test hedefi
        working-directory: mobile
        run: ruby scripts/ios-add-uitest-target.rb

      # CODE_SIGNING_ALLOWED=NO: imza kimliği yok ve gerekmiyor.
      #
      # Release, Debug değil: Debug yapı Metro sunucusu bekler ve tek başına
      # açılmaz, yani ekran görüntüsü alınamaz. Release JS paketini uygulamanın
      # içine gömüyor. Derleme kapısı olarak da daha sıkı — Debug'ın yaptığı her
      # şeyi yapıp üstüne paketlemeyi de yapıyor.
      #
      # -derivedDataPath: .app'in yeri tahmin edilebilir olsun, ekran görüntüsü
      # adımı onu bulabilsin (mobile/.gitignore › build/).
      - name: Simülatöre derle (Release)
        working-directory: mobile/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Lernomi.xcworkspace \
            -scheme Lernomi \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || xcodebuild build \
            -workspace Lernomi.xcworkspace \
            -scheme Lernomi \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # Metinler koda gömülü olmadığı için ayrıca bakılıyor: izin metinleri ve
      # arka plan modu, App Store incelemesinde ilk sorulan iki şey.
      - name: Info.plist beyanları
        working-directory: mobile/ios/Lernomi
        run: |
          python3 - <<'PY'
          import plistlib, sys
          d = plistlib.load(open("Info.plist", "rb"))
          eksik = []
          if "audio" not in (d.get("UIBackgroundModes") or []): eksik.append("UIBackgroundModes=audio")
          for k in ("NSMicrophoneUsageDescription", "NSSpeechRecognitionUsageDescription"):
              if not d.get(k): eksik.append(k)
          if d.get("ITSAppUsesNonExemptEncryption") is None: eksik.append("ITSAppUsesNonExemptEncryption")
          p = plistlib.load(open("PrivacyInfo.xcprivacy", "rb"))
          if not p.get("NSPrivacyCollectedDataTypes"): eksik.append("NSPrivacyCollectedDataTypes bos")
          if eksik:
              print("EKSIK:", ", ".join(eksik)); sys.exit(1)
          print("Info.plist ve PrivacyInfo tamam")
          PY

      # Uygulamayı iPhone SE simülatöründe açıp kare alır. Linux'ta iOS Simulator
      # yok (Android emülatörünün aksine macOS dışına çıkmıyor), bu runner tek
      # "Mac"imiz — düzen, renk ve koyu tema burada bedavaya görülüyor.
      # Mikrofon/arka plan sesi/kilit ekranı burada sınanamaz: gerçek cihaz ister.
      - name: Ekran görüntüleri
        working-directory: mobile
        run: bash scripts/ios-screenshots.sh

      # Onboarding'i tıklayarak geçer ve akışın karelerini alır. continue-on-error
      # kaldırıldı: koşu 33920804380'de uçtan uca çalıştı (TEST SUCCEEDED, dokuz
      # uygulama karesi). Artık burada bir kırılma gerçek bir kırılma — ya test
      # hedefi üretimi ya da uygulamanın açılış akışı bozulmuş demektir.
      - name: Akış kareleri (XCUITest)
        working-directory: mobile
        run: bash scripts/ios-flow-screenshots.sh
        env:
          # Test hesabı. Secret tanımlı DEĞİLSE değişkenler boş gelir ve tur giriş
          # duvarında durur — hata değil, o da bir ekran. Tanımlıysa tur giriş
          # yapıp sekmelerin altındaki ekranları da geziyor.
          #
          # Bu hesap ÜRETİM sunucusunda ve tur onun verisine dokunuyor (ilerleme,
          # tercihler). Gerçek bir kullanıcı hesabı verilmemeli; atılabilir bir
          # test hesabı olmalı. Geri dönülemez eylemler ayrıca metinle eleniyor
          # (bkz. scripts/ios-flow-screenshots.sh, BLOCK_KEYS).
          UI_TEST_EMAIL: ${{ secrets.UI_TEST_EMAIL }}
          UI_TEST_PASSWORD: ${{ secrets.UI_TEST_PASSWORD }}

      # Derleme düşse bile o ana kadarki kareler ve simülatör günlüğü insin —
      # boş bir kare, uygulamanın açılışta çöktüğünü söyleyen kanıttır.
      - name: Kareleri yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ekran-goruntuleri
          path: mobile/ios/build/screenshots
          if-no-files-found: warn
