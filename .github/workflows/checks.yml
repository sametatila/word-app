# Ucuz kontroller — Linux. Public depoda standart runner'lar ücretsiz, ama iş
# yine de doğru makineye konuyor: bunların hiçbiri macOS istemiyor.
name: Kontroller

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Yetki testi GERÇEK Postgres istiyor ve taklidi işe yaramaz: sınadığı
    # şeylerin yarısı veritabanının kendi davranışı — benzersiz kısıtın
    # çakışması, `for update` olmadan oluşan kayıp güncelleme, `now()`un
    # cümlenin içinde değerlendirilmesi. Bellekte bir sahte katman bunların
    # hiçbirini üretmez, yalnız yeşil gösterir.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lernomi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      # Sürüm kapısı, en başta: dört kaynak (package.json, mobile/src/version.ts,
      # build.gradle, pbxproj) aynı sürümü söylemek zorunda. Saniye sürüyor ve
      # yakaladığı şey ancak mağazada, geri alınamaz bir yükleme numarasıyla
      # fark edilirdi.
      - name: Sürüm
        run: npm run version:check
      - name: TypeScript
        run: npx tsc --noEmit
      # `scripts/` ana tsconfig'in `exclude`ında: uygulama derlemesi oraya hiç
      # bakmıyor. Sonuç ölçüldü — e2e ağı aylarca derlenmeden durdu (bkz.
      # docs/plan/web-parity.md §8) ve aynı şey lig işi `getLeaderboard`'u
      # kaldırınca tekrarlandı. Ayrı kapı olmadan bu sınıf hata sessiz kalıyor.
      - name: TypeScript (betikler)
        run: npm run typecheck:scripts
      # Cırcırlı taban: eşik package.json'daki `lint` betiğinde (--max-warnings),
      # gerekçesi ve kural kural sayılar eslint.config.mjs'te. Yeni ihlal eşiği
      # aşar ve burası kırılır; listede olmayan her kural zaten hata.
      - name: ESLint
        run: npm run lint
      # Kontrast kapısı. `scripts/palette-check.mjs` on iki bölümde ölçüm
      # yapıyor ve bu oturumda dört bölüm EKLENDİ - hepsi gerçek hatalardan
      # doğdu: kehribar dolu zemin üstünde beyaz yazı 2.88, koyu temada sayaç
      # rozeti 1.49, dolu vurgu karosunun ikonu 1.49-2.06. Kapı CI'da hiç
      # çalışmıyordu; elle çağrılan bir kapı, kapı değildir.
      - name: Palet kontrastı
        run: node scripts/palette-check.mjs
      # Kayıt defteri paritesi: web ve mobil aynı sabit listelerin iki
      # kopyasını taşıyor (kurslar, oyunlar, başarım grupları, sınav bölüm
      # sırası, deneme becerileri, CEFR seviyeleri). Kopyalar sessizce
      # ayrışıyor: `speechLocale` mobilde vardı webde yoktu ve web İngilizce
      # kursta konuşmayı Almanca dinliyordu.
      - name: Kayıt defteri paritesi
        run: npm run check:parity
      # Premium kurallarının birim testi — veritabanı istemiyor. Paket ilerlemesi,
      # yapılandırma doğrulaması ve paywall metinlerinin üç sözlükte de bulunması.
      # Bu sınıfın tamamı ancak gerçek para akarken fark edilirdi.
      - name: Premium kuralları
        run: npm run test:premium
      # Bağımlılığı olmayan birim testleri — hepsi saf, veritabanı ve ağ
      # istemiyor, saniyeler sürüyor. Onikisi de depoda YAZILIYDI ama hiçbiri
      # otomatik çalışmıyordu ve biri (test:track) sessizce KIRMIZIYDI: quiz
      # cümleleri çağırana taşınınca test eski Türkçe cümleyi aramaya devam
      # etmişti. Çalıştıran olmayınca kırık test kırık kalıyor.
      - name: Birim testleri
        run: |
          npm run test:award
          npm run test:coach-lines
          npm run test:events
          npm run test:numbers
          npm run test:options
          npm run test:pronounce
          npm run test:rules
          npm run test:match
          npm run test:track
          npm run test:vad
          npm run test:walkqueue
          npm run test:why
      # Anadil ekseninin kapısı. Buradaki hata sessiz: anlam yanlış dilde
      # gelince uygulama çalışmaya devam eder, yalnız kullanıcı anlamadığı
      # dilde soru görür. En kritik kural sınanıyor — karşılık yoksa Türkçeye
      # DÜŞÜLMEZ, kelime turdan çıkar.
      - name: Anadil ekseni
        run: npm run test:gloss
      # Lig kapanışının kuralları: kaç kişi yükselir/düşer ve kimin akıbeti ne.
      # Bu kapı zamanlama yüzünden var — kapanış YALNIZ pazartesi, yalnız
      # veritabanıyla ve yalnız bir haftalık veri birikmişken çalışıyor, yani
      # yanlış bir kural elle denenerek görülemez; bir hafta sonra gerçek
      # kullanıcıların tablosunda görülür ve geri alınamaz.
      - name: Lig kuralları
        run: npm run test:league
      # Sözlük kapısı + ham metin kapısı. Birincisi üç dilin anahtar kümesini ve
      # yer tutucularını karşılaştırıyor; ikincisi sözlüğe HİÇ GİRMEMİŞ Türkçe
      # metni sayıyor (cırcırlı taban, yalnız aşağı iner). İkincisi olmadan
      # doğrulama e-postası, Patika başlıkları ve AI kapalıyken çıkan geri
      # bildirim aylarca Türkçe kaldı ve hiçbir denetim bunu söylemedi.
      - name: i18n kapısı
        run: npm run i18n:check
      # Hukuki metinlerin kapısı. Buradaki hata sınıfı derlemeyi kırmıyor,
      # yayımlanmış metni okuyan biri fark ediyor: elle iki yerde artırılan
      # sürüm numarası, bir dile eklenip ötekine eklenmeyen kayıt maddesi,
      # tabloda boş kalan hücre, sayfası olmayan yol (biri App Store'un
      # Support URL alanına giriyor).
      - name: Hukuki metinler
        run: npm run test:legal
      # Yetki katmanının veritabanı testi — 32 doğrulama. Buradaki hata sınıfı
      # sessiz: yanlış hesaplanmış bir bitiş tarihi ya da iki kez uygulanmış bir
      # ödeme olayı kullanıcı şikâyet edene kadar görünmez, sonra da parayla
      # ilgili olduğu için geri alınması pahalıdır. Boş veritabanına bütün
      # migration'lar uygulanıp şema kodla karşılaştırılıyor: migration yazmayı
      # unutmak da burada düşüyor.
      # `test:legal-db` de burada: hukuki metinler artık panelden düzenleniyor ve
      # o yolun her adımı yayına çıkmış bir sözleşme sayfasını değiştiriyor —
      # bozuk girdinin geri çevrildiği, "varsayılana dön"ün gerçekten döndüğü ve
      # boş bir gövdenin sayfayı boşaltmadığı veritabanı olmadan sınanamıyor.
      - name: Yetki ve hukuki metin (veritabanı)
        run: |
          npx tsx scripts/migrate-all.ts
          npx tsx scripts/schema-check.ts
          npm run test:entitlement
          npm run test:legal-db
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/lernomi_test
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/lernomi_test
      - name: next build
        run: npx next build
        env:
          # Derleme sırasında veritabanına gidilmiyor; sırlar gerekmez.
          NEXT_TELEMETRY_DISABLED: "1"

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/package.json
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - working-directory: mobile
        run: npm ci
      - name: TypeScript
        working-directory: mobile
        run: npx tsc --noEmit
      # Eşik 0: mobil lint 2fff5cb5'te sıfırlandı (üç kural gerekçesiyle
      # kapatıldı, kalanı düzeltildi). 9999 kalsaydı kapı kapı olmaktan çıkardı —
      # yeni bir uyarı fark edilmeden birikirdi.
      #
      # ESLINT_USE_FLAT_CONFIG=false ZORUNLU: mobil hâlâ ESLint 8 + .eslintrc.js
      # kullanıyor, ama ESLint 8.57 düz (flat) yapılandırmayı ÜST DİZİNLERDE de
      # arıyor ve depo kökündeki eslint.config.mjs'i bulup kipi değiştiriyor —
      # o dosyanın "mobile/**" yoksayması yüzünden "all of the files matching
      # the glob pattern 'src' are ignored" ile düşüyordu. Mobil ESLint 9'a
      # geçince bu bayrak kalkar ve mobile/eslint.config.mjs gerekir.
      - name: ESLint
        working-directory: mobile
        run: npx eslint src App.tsx --max-warnings 0
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
      # Çeviri katmanını atlayan yeni Türkçe dizgi girmesin (cırcırlı taban).
      - name: i18n kapısı
        working-directory: mobile
        run: node scripts/i18n-scan.js --check
      # iOS paketinin elle tutulan yerleri: sürüm üçlüsü, ikon ölçüleri, .strings,
      # dil beyanı, pbxproj bütünlüğü. Hiçbiri macOS istemiyor ve hiçbirini
      # ios-build.yml yakalamıyor — o simülatöre imzasız derliyor, bu sınıf ancak
      # App Store'a yüklerken patlıyor. Saniyeler sürüyor, pahalı işten önce düşsün.
      - name: iOS paket denetimi
        working-directory: mobile
        run: npm run ios:check
      - name: Jest
        working-directory: mobile
        run: npx jest --silent
