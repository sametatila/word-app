# Ucuz kontroller — Linux. Public depoda standart runner'lar ücretsiz, ama iş
# yine de doğru makineye konuyor: bunların hiçbiri macOS istemiyor.
name: Kontroller

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      # Cırcırlı taban: eşik package.json'daki `lint` betiğinde (--max-warnings),
      # gerekçesi ve kural kural sayılar eslint.config.mjs'te. Yeni ihlal eşiği
      # aşar ve burası kırılır; listede olmayan her kural zaten hata.
      - name: ESLint
        run: npm run lint
      - name: next build
        run: npx next build
        env:
          # Derleme sırasında veritabanına gidilmiyor; sırlar gerekmez.
          NEXT_TELEMETRY_DISABLED: "1"

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/package.json
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - working-directory: mobile
        run: npm ci
      - name: TypeScript
        working-directory: mobile
        run: npx tsc --noEmit
      # ESLINT_USE_FLAT_CONFIG=false ZORUNLU: mobil hâlâ ESLint 8 + .eslintrc.js
      # kullanıyor, ama ESLint 8.57 düz (flat) yapılandırmayı ÜST DİZİNLERDE de
      # arıyor ve depo kökündeki eslint.config.mjs'i bulup kipi değiştiriyor —
      # o dosyanın "mobile/**" yoksayması yüzünden "all of the files matching
      # the glob pattern 'src' are ignored" ile düşüyordu. Mobil ESLint 9'a
      # geçince bu bayrak kalkar ve mobile/eslint.config.mjs gerekir.
      - name: ESLint
        working-directory: mobile
        run: npx eslint src App.tsx --max-warnings 9999
        env:
          ESLINT_USE_FLAT_CONFIG: "false"
      # Çeviri katmanını atlayan yeni Türkçe dizgi girmesin (cırcırlı taban).
      - name: i18n kapısı
        working-directory: mobile
        run: node scripts/i18n-scan.js --check
      # iOS paketinin elle tutulan yerleri: sürüm üçlüsü, ikon ölçüleri, .strings,
      # dil beyanı, pbxproj bütünlüğü. Hiçbiri macOS istemiyor ve hiçbirini
      # ios-build.yml yakalamıyor — o simülatöre imzasız derliyor, bu sınıf ancak
      # App Store'a yüklerken patlıyor. Saniyeler sürüyor, pahalı işten önce düşsün.
      - name: iOS paket denetimi
        working-directory: mobile
        run: npm run ios:check
      - name: Jest
        working-directory: mobile
        run: npx jest --silent
