# Ucuz kontroller — Linux. Public depoda standart runner'lar ücretsiz, ama iş
# yine de doğru makineye konuyor: bunların hiçbiri macOS istemiyor.
name: Kontroller

# TETİKLEYİCİ DAR (2026-09-23, Samet: Actions kotası dolmasın). Eskiden her
# dalda her push'ta koşuyordu. Artık yalnız main'e push ve PR; yalnız belge
# değişen push'ta hiç koşmuyor. Depo public iken dakika ücretsiz ama private'a
# geçildiğinde kota ayda 2.000 dk ve bu iş koşu başına ~7 dk (web ~6, mobil ~1).
# İstisna: parite kapısı docs/plan/ios-parity.md'yi okuyor; o değişirse koşar.
# Elle: gh workflow run Kontroller --ref <dal>
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "reports/**", "**/*.md", "!docs/plan/ios-parity.md"]
  pull_request:
    paths-ignore: ["docs/**", "reports/**", "**/*.md", "!docs/plan/ios-parity.md"]
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

# actions/checkout işe `git init` ile başlıyor ve runner'daki git
# init.defaultBranch ayarsızken her job'da çok satırlı bir "hint: Using
# 'master' as the name for the initial branch" uyarısı basıyordu. Ayar ortam
# değişkeniyle veriliyor (git GIT_CONFIG_COUNT/KEY/VALUE'yu okuyor); ayrı bir
# adım ya da global yapılandırma gerekmiyor.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Yetki testi GERÇEK Postgres istiyor ve taklidi işe yaramaz: sınadığı
    # şeylerin yarısı veritabanının kendi davranışı — benzersiz kısıtın
    # çakışması, `for update` olmadan oluşan kayıp güncelleme, `now()`un
    # cümlenin içinde değerlendirilmesi. Bellekte bir sahte katman bunların
    # hiçbirini üretmez, yalnız yeşil gösterir.
    services:
      postgres:
        # Debian tabanlı imaj: alpine'da sistem yereli olmadığı için initdb
        # "no usable system locales were found" uyarısı basıyordu.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lernomi_test
          # Kimlik doğrulama yöntemleri AÇIKÇA veriliyor. Verilmeyince initdb
          # "enabling trust authentication for local connections" uyarısı
          # basıyor. Yerel soket trust kalıyor, TCP parolalı; testler zaten
          # parolayla bağlanıyor.
          POSTGRES_INITDB_ARGS: "--auth-local=trust --auth-host=scram-sha-256"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      # v7: node24 çalışma zamanı. v4 Node 20 hedefliyordu ve GitHub her job'da
      # "Node.js 20 is deprecated" uyarısı basıyordu.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm }
      - run: npm ci
      # Sürüm kapısı, en başta: dört kaynak (package.json, mobile/src/version.ts,
      # build.gradle, pbxproj) aynı sürümü söylemek zorunda. Saniye sürüyor ve
      # yakaladığı şey ancak mağazada, geri alınamaz bir yükleme numarasıyla
      # fark edilirdi.
      - name: Sürüm
        run: npm run version:check
      # ÜRETİLEN İÇERİK, tip denetiminden ÖNCE. src/lib/conversations/generated/
      # native-*.json depoda yok (.gitignore); deploy onları `npm run build`in
      # başında üretiyor. native-server.ts bu dosyaları içe aldığı için temiz
      # bir klonda tip denetimi, betik tipleri ve döküm bütünlüğü "Cannot find
      # module" / ENOENT ile düşüyordu ve sonraki adımların hiçbiri koşmuyordu.
      - name: Üretilen içerik
        run: |
          npm run conversations:apply
          npm run conversations:apply-de
      - name: TypeScript
        run: npx tsc --noEmit
      # `scripts/` ana tsconfig'in `exclude`ında: uygulama derlemesi oraya hiç
      # bakmıyor. Sonuç ölçüldü — e2e ağı aylarca derlenmeden durdu (bkz.
      # docs/plan/web-parity.md §8) ve aynı şey lig işi `getLeaderboard`'u
      # kaldırınca tekrarlandı. Ayrı kapı olmadan bu sınıf hata sessiz kalıyor.
      - name: TypeScript (betikler)
        run: npm run typecheck:scripts
      # Cırcırlı taban: eşik package.json'daki `lint` betiğinde (--max-warnings),
      # gerekçesi ve kural kural sayılar eslint.config.mjs'te. Yeni ihlal eşiği
      # aşar ve burası kırılır; listede olmayan her kural zaten hata.
      - name: ESLint
        run: npm run lint
      # Kontrast kapısı. `scripts/palette-check.mjs` on iki bölümde ölçüm
      # yapıyor ve bu oturumda dört bölüm EKLENDİ - hepsi gerçek hatalardan
      # doğdu: kehribar dolu zemin üstünde beyaz yazı 2.88, koyu temada sayaç
      # rozeti 1.49, dolu vurgu karosunun ikonu 1.49-2.06. Kapı CI'da hiç
      # çalışmıyordu; elle çağrılan bir kapı, kapı değildir.
      - name: Palet kontrastı
        run: node scripts/palette-check.mjs
      # Kayıt defteri paritesi: web ve mobil aynı sabit listelerin iki
      # kopyasını taşıyor (kurslar, oyunlar, başarım grupları, sınav bölüm
      # sırası, deneme becerileri, CEFR seviyeleri). Kopyalar sessizce
      # ayrışıyor: `speechLocale` mobilde vardı webde yoktu ve web İngilizce
      # kursta konuşmayı Almanca dinliyordu.
      - name: Kayıt defteri paritesi
        run: npm run check:parity
      # Her ucun bir çağıranı var mı. Uç yazılıp istemciye bağlanmadığında
      # derleme geçiyor, lint geçiyor, uç sessizce çürüyor: `/api/plan`ın
      # istemcisi bir parite turunda kaldırılmıştı, `/api/premium/consume`
      # tur başına kotayı sayan tek yer ve çağıranı hiç olmadı. Çağıranı
      # repoda olmayan uçlar betikteki listede SEBEBİYLE yazılı.
      - name: Uç çağıranları
        run: npm run check:endpoints
      # Renk KAYNAĞI kapısı. `palette-check` paletin kendisini ölçüyor ama
      # bileşenlerin onu nasıl kullandığını görmüyor: üç web ekranı sabit
      # basamağı metin rengi yapmış (koyu temada 2.83-3.24) ve mobilde iki
      # yerde renk paletin dışından geliyordu (artikel tonları, günün turu
      # madalyası; altı ölçümden altısı sınırın altında). Üçü de derleme,
      # lint ve kontrast kapısından geçiyordu.
      - name: Renk kaynağı
        run: npm run check:colors
      # Tasarım ölçekleri iki platformda aynı mı. Tipografi, yarıçap ve boşluk
      # elle hizalanmış ve gerekçeleri yazılı ama hiçbir şey ölçmüyordu:
      # mobilde `radii.lg`yi 20'den 18'e çeken bir düzenleme webi sessizce
      # ayırır ve hata ancak iki ekranı yan yana koyan biri fark ederse
      # görünür. `check:parity` kayıt defterleri için ne yapıyorsa bu betik
      # tasarım ölçekleri için onu yapıyor.
      - name: Tasarım jetonları
        run: npm run check:tokens
      # AYNI AİLEDEN DOKUZ KAPI DAHA, hepsi yazıldı ve hiç çağrılmadı.
      # `check:colors` ile `check:tokens` CI'daydı, kardeşleri değildi —
      # ölçüldü (2026-09-12): dokuzu da BUGÜN sıfır hata veriyor ve toplam
      # altı saniye sürüyor. Bir kapının yazılıp çağrılmaması, yazılmamasıyla
      # aynı kapı; üstelik daha kötüsü, çünkü kimse eksikliği aramıyor.
      # Ne ölçüyorlar: `client-boundary` sunucu-yalnız modülün istemciye
      # sızmasını, `purge` silme yolunun tabloları eksiksiz süpürdüğünü,
      # `key-families` sözlük anahtar ailelerinin üç dilde birlikte
      # taşındığını, `radius`/`type`/`hit`/`selection`/`loading`/`title` ise
      # yarıçap, tipografi ölçeği, dokunma hedefi, seçim durumu, iskelet ve
      # başlık kurallarını. Hepsi saf statik; ne veritabanı ne ağ istiyor.
      # `check:tts` bunlara 2026-09-18'de katıldı ve ölçtüğü şey SESSİZ bir
      # sınıf: seslendirmenin bozulma biçimlerinin hiçbiri tip hatası vermiyor,
      # günlüğe düşmüyor, yalnız öğrencinin hiçbir şey duymamasıyla ortaya
      # çıkıyor. Kurulduğu gün üçü canlıydı — uç 600 karakterin üstünü
      # REDDETTİĞİ için deneme sınavındaki dinleme diyaloglarının 171'i ve
      # okuma alıştırmalarının 85'i hiç çalmıyordu, ve çok konuşmacılı 800
      # diyalogun hepsi tek ağızdan okunuyordu. Kapı dört şeyi ölçüyor:
      # uzunluk, konuşmacı çözümü ve blok içi ses çakışması, bölme kaybı
      # (parçaların birleşimi metnin birebir aynısı olmalı) ve web↔mobil
      # paritesi. Saf statik; ne veritabanı ne ağ istiyor.
      # `test:tts-own` (2026-09-23) kelime katmanının Defne/Aras sözleşmesini
      # sabitliyor: eski seçimlerin cinsiyetine göre çevrilmesi, kelime
      # isteğinin tabloda yoksa Edge'e DÜŞMEYİP 404 dönmesi, ETag/aralık.
      # Geçici bir dizinde sahte tabloyla; veritabanı ve ağ yok.
      - name: Tasarım ve kod kapıları
        run: |
          npm run check:tts
          npm run test:tts-own
          npm run check:client-boundary
          npm run check:purge
          npm run check:guest-merge
          npm run check:key-families
          npm run check:radius
          npm run check:type
          npm run check:hit
          npm run check:selection
          npm run check:loading
          npm run check:title
      # Mobil paket kaynakla aynı içeriği taşıyor mu. DÖRT köprü ELLE
      # çalıştırılıyor: kaynağa yeni bir konuşma/egzersiz/kâğıt eklenip döküm
      # yenilenmezse mobil o içeriği sessizce taşımaz ve hata ancak ekranda
      # görünür (Patika'da açılamayan ünite, listede olmayan kâğıt).
      #
      # Dördüncüsü ANA DİL dökümü ve ölçütü farklı: kimlik değil BAYT
      # eşitliği. Öteki üçünde metin sürekli değişiyor ve tam eşitlik yarım
      # kalmış her işte kırmızı yanardı; ana dil dökümünün iki dosyası ise
      # tümüyle türetilmiş, ayrışmaları ancak dökümün unutulması demek.
      - name: Döküm bütünlüğü
        run: npm run check:dumps
      # Ana dil ekseninin on dört kapısı. On dördü de SESSİZ bozulmaya karşı:
      # çözücü bir parçanın karşılığını bulamayınca konuşmayı tümden reddediyor
      # ve `localiseConversation` Türkçeye düşüyor — hiçbir yerde hata görünmüyor,
      # İngilizce kurs yalnızca Türkçe olarak açılıyor. Bir konuşma düzenlemesi
      # tek bir dizeyi kaydırdığında bu olabiliyor. `check:conversations-native`
      # sözlüğü baştan kurup 580 konuşmanın her Türkçe parçasını çözüyor;
      # `check:conversations-swap` Almanca takas tablosunun kaynakla tuttuğunu ve
      # karara bağlanmamış bir iz kalmadığını ölçüyor; `check:skills-native`
      # aynı şeyi 995 beceri egzersizi için yapıyor (düz metin, görev metni ve
      # katlanan sözlükçe); `check:skills-task` ise görev metni hattının
      # yazılanını denetliyor.
      # Bu üçü (`conversations-native`, `skills-native`, `conversations-swap`) üretilen
      # sözlüğü BAŞTAN kurup çalışma anındaki nesneler üzerinde çalışıyor:
      # hattın kendi kapısı yazılanı ölçer, bunlar yazılanın uygulamaya
      # VARDIĞINI ölçer. Aradaki boşluk bir kez zaten canlıya çıktı
      # (`derived.json` .gitignore'daydı, sunucu derlemesi sözlüğü eksik
      # kurdu, İngilizce kurs sessizce Türkçe açıldı).
      #
      # `check:mock-prose` YAZILANI ölçüyor: 60 Almanca deneme kâğıdının
      # Türkçe her dizesini — yönerge, ölçüt, dinleme durumu ve açıklama,
      # 6.627 dize. Hat 6627/6627'ye ulaşınca eklendi; o güne kadar BİLEREK
      # dışarıda tutuldu, çünkü kapsam kuralı yarım bir hatta her koşuda
      # kırmızı döner ve alışılan kırmızı kapı olmaktan çıkar.
      #
      # `check:mock-native` onun ÇİFTİ ve tam da bu ayrımı savunuyor: 6.627
      # dize yazılmıştı ama `apply.mjs` dizini okumadığı için hiçbiri
      # uygulamaya ulaşmıyordu ve YAZILANI ölçen kapı bunu göremiyordu.
      # Yazmak ile bağlamak ayrı iki iş; ikisini tek kapıya sormak birini
      # sessizce cevapsız bırakıyor.
      #
      # `check:mock-prose-de` aynı işi ÖTEKİ yönde yapıyor: 60 İngilizce
      # deneme kâğıdının Türkçe her dizesinin Almancası, 6.828 dize. O da
      # hat 6828/6828'e ulaşınca eklendi ve aynı gerekçeyle o güne kadar
      # dışarıda tutuldu. Kendi kapısı, `--de` bayrağıyla aynı check.ts:
      # İngilizce yazım kuralı yalnız `en` yüzünde çalışıyor, Türkçeye özgü
      # harfler ise kasten kümenin dışında — kalan bir `ş` çevrilmemiş
      # metin demek (m-039'da kâğıttaki «Ayse» ile gerekçedeki "Ayşe"nin
      # ayrıştığı böyle görüldü).
      #
      # `check:conversations-prose-de` konuşma düzyazısının Almancasını ölçüyor:
      # 580 konuşmanın Türkçe her parçası — partner, açılış, başlık, özet, sahne,
      # hedef, gerekçe, örüntü, sözcük, ipucu ve anlatım — 11.011 dize.
      # Öbür ikisiyle aynı gerekçeyle hat 11011/11011'e ulaşana kadar
      # BİLEREK dışarıda tutuldu. Kendi kapısı üç şeyi birden savunuyor:
      # son noktalama (kayan bir satır burada yakalanıyor — bir paket
      # 149 dize gelince hizalama bozuluyor ve sessizce yanlış konuşmaya
      # yazılıyordu), sayılar, ve karakter kümesi. Küme kuralı Türkçeye
      # özgü harfleri dışarıda tutuyor: kalan bir `ş` çevrilmemiş metin
      # demek. Tek gevşetme, konuşmanın İngilizce yüzünde SÖZCÜK olarak geçen
      # özel adlar — sesin söylediği ad yerinde kalmak zorunda.
      #
      # `check:skills-prose-de` aynı işi beceri egzersizlerinde yapıyor:
      # İngilizce kursun 189 egzersizinin `intro`, `explain` ve sözlükçe
      # alanları, 1.725 dize. Kapsam KASTEN dar — kardeşi `check:skills-prose` bütün
      # egzersizlerden çıkarıp İngilizce yazdırıyor, çünkü anadili
      # İngilizce olan kullanıcı ALMANCA kursu görüyor; anadili Almanca
      # olan ise yalnız İngilizce kursu alıyor. Kanıt ölçütü de burada
      # tahmine dayanmıyor: paket satırı egzersizin İngilizce yüzeyini
      # (metin, soru kökleri, şıklar) yanında taşıyor ve açıklık orada
      # birebir varsa çevrilmeden durmak zorunda. Ölçüldü: 555 aday
      # açıklığın 300'ü yüzeyde.
      #
      # `check:skills-task-de` görev metninin Almancasını ölçüyor: aynı 189
      # egzersizin yönerge, ipucu ve geri bildirim alanları, 1.325 dize.
      # Kardeşi `check:skills-task` bunu öteki yönde yapıyor. Üç kuralı
      # hatta özgü: egzersizin İngilizce yüzeyinde geçen açıklıklar
      # çevrilmeden durmak zorunda; telaffuz ipuçları ÇEVRİLMİYOR, Almanca
      # okuma alışkanlığına göre YENİDEN yazılıyor (karakter kümesi kuralı
      # bunu zorluyor: `ÇİL-drın` Türkçe harfleriyle geçemez, `TSCHIL-dren`
      # geçer); `build.tr` ise cevabı vermemek zorunda.
      #
      # `check:native-de` bu dördünün ÇİFTİ ve tek başına duruyor: dördü
      # YAZILANI ölçüyor, o ise üretilen `native-de.json`ı açıp çözücüleri
      # 200 konuşma, 189 egzersiz ve 60 kâğıt üzerinde çalıştırıyor. Aradaki
      # boşluk bu depoda bir kez zaten açıldı (kâğıt hattında 6.627 dize
      # yazılmıştı, `apply.mjs` dizini okumuyordu, kapı bunu göremiyordu).
      # Üçüncü bir ölçütü daha var: çözülen içerikte Türkçe kalıp kalmadığı.
      # İlk iki ölçüt yalnız çıkarıcının BİLDİĞİ alanları görüyor; içeriğe
      # yeni bir Türkçe alan eklenirse kapı yeşil kalır ve Türkçe doğrudan
      # Alman okurun ekranına çıkar. Tarama alan adına hiç bakmıyor,
      # 102.083 dize geziyor.
      #
      # `check:conversations` konuşma SÖZLEŞMESİNİ ölçüyor: sekiz kelime, her kelimenin
      # sesli tekrarı, üretim ipucunun tam cümleyi vermesi, 14-24 adım,
      # açılışın soruyla bitmesi. Almanca kursun 580 konuşması baştan beri
      # geçiyordu; İngilizce kursun 200 konuşması 1.017 hata veriyordu ve kapı bu
      # yüzden CI dışındaydı — okunmayan kırmızı bir kapı, olmayan kapıdır.
      # Kullanıcı kararıyla (2026-09-11) İngilizce kurs aynı sözleşmeye
      # getirildi: 600 kelime, 496 ipucu, 143 tekrar adımı ve 16 açılış.
      # Sıfıra inince alındı.
      #
      # `check:conversations-cando` ile `check:conversations-cando-de` dersin altındaki
      # "bunu yapabileceksin" köprüsünün iki yönü, 131 ifade. İkisi de
      # çözücüden GEÇMİYOR: karşılığı olmayan ifade hata vermiyor, sessizce
      # DÜŞÜYOR — yani eksik bir çeviri ekranda yalnızca kısalık olarak
      # görünür. Birincisi bugüne kadar hiç CI'da değildi; ikincisi
      # yazılınca ikisi birlikte alındı.
      - name: Ana dil çözücüsü
        run: |
          npm run check:conversations-native
          npm run check:conversations-swap
          npm run check:skills-native
          npm run check:skills-task
          npm run check:mock-prose
          npm run check:mock-prose-de
          npm run check:mock-native
          npm run check:conversations-prose-de
          npm run check:skills-prose-de
          npm run check:skills-task-de
          npm run check:native-de
          npm run check:conversations-cando
          npm run check:conversations-cando-de
          npm run check:conversations
      # HATTIN KENDİ KAPILARI — dokuzu da yazılmış, hiçbiri çağrılmıyordu.
      # Yukarıdaki blok TÜRETİLMİŞ tarafı ölçüyor (`-de`, `-native`, `-prose`);
      # bunlar KAYNAK tarafı: konuşma sözlükçesi, kalıplar, üstveri, sohbet,
      # anlatım, kelime turu, betik, sınav ve beceri düzyazısı. Türetilmiş
      # tarafın kapısı yeşilken kaynağın bozulması mümkün ve tam da sessiz
      # bozulma sınıfı — çözücü kaynağı bulamayınca Türkçeye düşüyor.
      # Ölçüldü (2026-09-12): dokuzu da sıfır hata, toplam dört saniye.
      #
      # `test:content` bunların üstünde duruyor: uyarı bütçesi ETİKET başına
      # ve `data/content/baseline.json` bugün TAMAMEN SIFIR. Bütçe mekanizması
      # tam da CI için yazılmıştı (`--baseline` ile bilinçli kabul) ama kapı
      # hiç çağrılmadı; yani bütçe aşılsa kimse görmeyecekti.
      - name: Konuşma ve içerik kaynağı
        run: |
          npm run check:conversations-vocab
          npm run check:conversations-patterns
          npm run check:conversations-meta
          npm run check:conversations-chat
          npm run check:conversations-lecture
          npm run check:conversations-word
          npm run check:conversations-script
          npm run check:conversations-exam
          npm run check:conversations-exam-de
          npm run check:skills-prose
          npm run test:content
      # Sınav üretiminin testleri. `test:exams` ile `test:mock-exams` kâğıtları,
      # `test:exam-build` sınav kurucusunu (bu betik bir dönem SESSİZCE
      # kırıktı: `ensureProfile` eklenince saplama veritabanı geride kaldı,
      # kimse çalıştırmadığı için aylarca fark edilmedi), `test:loop` ise
      # yineleme mantığını ölçüyor. Dördü de veritabanı ve ağ istemiyor.
      - name: Sınav üretimi
        run: |
          npm run test:exams
          npm run test:mock-exams
          npm run test:exam-build
          npm run test:loop
      # SÖZLÜKÇE BÜTÇESİ — sıfıra inemeyen bulguyu yine de kapı yapan desen.
      # İki rapor, ünite penceresinin dışına çıkan sözcükleri sayıyor ve sayı
      # sıfır DEĞİL (Almancada 1.443, İngilizcede 109 geçiş); çoğu gerçek bir
      # içerik kararı bekliyor, bazıları da kapının kendi yaklaşıklığı. Böyle
      # bir kapıyı "sıfır olsun" diye kurmak her zaman kırmızı yanan bir kapı
      # demekti, hiç kurmamak da borcun sessizce büyümesi. Üçüncü yol
      # `check-content`te zaten vardı ve buraya alındı: BUGÜNKÜ sayıyı dondur,
      # BÜYÜMEYİ reddet. Taban `data/content/vocab-{de,en}-baseline.json`,
      # ETİKET başına (seviye × bulgu sınıfı) — tek toplam olsaydı A2'nin
      # "seviye üstü" borcunu azaltıp C1'e "havuzda yok" borcu eklemek
      # bütçeyi tutardı. Yeni etiket de açılamıyor: Almanca B1 tabanda HİÇ
      # yok, yani bugünkü sıfır hâli donduruldu, ilk bulgu kırmızı yakar.
      # Bilinçli artış `-- --baseline` ile yazılıyor, yani artış bir dosya
      # değişikliği olarak İNCELEMEYE giriyor. Süre: Almanca 114 sn (beş
      # seviye × 870 egzersiz), İngilizce 5 sn.
      - name: Sözlükçe bütçesi
        run: |
          npm run check:unitvocab
          npm run check:en-unitvocab
      # PATİKA BÜTÇESİ — aynı desen ama İKİ YÖNLÜ. Burada iki ölçü var ve
      # zıt yönlerde iyi oluyorlar: `bosluk` bir BORÇ (kurs metninde geçip
      # hiçbir konuşmada öğretilmeyen sözcük sayısı) ve büyüyemez; `kapsam` bir
      # KAZANÇ (patikanın havuzu öğretme oranı) ve DÜŞEMEZ. Kazancı tavanla
      # korumak saçma olurdu — "kapsamı artırma" diyen bir kapı. İkisi aynı
      # taban dosyasında duruyor ki bir seviyenin borcu ile kazancı yan yana
      # okunsun. Kapı iki yönde de sınandı: tavan düşürülünce `87 > 85`,
      # zemin yükseltilince `98 < 99 (DÜŞTÜ)`. İki saniye sürüyor.
      - name: Patika bütçesi
        run: npm run check:pathgap
      # de→en kelime katmanının kapısı. Örnek cümlenin Almanca çevirisi
      # TÜRETİLEMİYOR ve bu ölçüldü: İngilizce örnek cümleler Almanca cümlenin
      # çevirisi değil, aynı kelime için BAĞIMSIZ yazılmış cümleler
      # («pflegen» Almancada hasta anneye bakmak, İngilizcede hemşirelerin
      # hasta bakması). Devralınsaydı kullanıcı cümleyle ilgisiz bir çeviri
      # görürdü — eksik çevirinin en kötü biçimi, çünkü görünürde çalışır.
      # Kapı iki şeyi birden ölçüyor: 7.175 karşılık ve 7.175 cümle. En
      # önemli kuralı, Almanca karşılığın cümlede GEÇMESİ — geçmiyorsa
      # çeviri o kelimeyi örneklemiyor demektir. Öbür üç düzyazı kapısıyla
      # aynı gerekçeyle hat 7175/7175'e ulaşana kadar dışarıda tutuldu.
      - name: en→de örnek cümleleri
        run: npm run check:en-de
      # Premium kurallarının birim testi — veritabanı istemiyor. Paket ilerlemesi,
      # yapılandırma doğrulaması ve paywall metinlerinin üç sözlükte de bulunması.
      # Bu sınıfın tamamı ancak gerçek para akarken fark edilirdi.
      - name: Premium kuralları
        run: npm run test:premium
      # Bağımlılığı olmayan birim testleri — hepsi saf, veritabanı ve ağ
      # istemiyor, saniyeler sürüyor. Onikisi de depoda YAZILIYDI ama hiçbiri
      # otomatik çalışmıyordu ve biri (test:track) sessizce KIRMIZIYDI: quiz
      # cümleleri çağırana taşınınca test eski Türkçe cümleyi aramaya devam
      # etmişti. Çalıştıran olmayınca kırık test kırık kalıyor.
      #
      # `test:apple` bu listeye sonradan katıldı ve diğerlerinden ağır basıyor:
      # Apple'ın sunucudan sunucuya bildirim ucu kimlik doğrulamasız ve herkese
      # açık, tek kapısı imza. O doğrulamadaki bir gerileme (alg başlığına
      # uymak, aud'u atlamak) uydurma bir bildirimle hesap sildirmeye kadar
      # gider ve başka hiçbir yerde görünmez.
      - name: Birim testleri
        run: |
          npm run test:apple
          npm run test:password
          npm run test:award
          npm run test:coach-lines
          npm run test:rounds
          npm run test:contractions
          npm run test:events
          npm run test:numbers
          npm run test:options
          npm run test:pronounce
          npm run test:rules
          npm run test:match
          npm run test:moderation
          npm run test:rc-delete
          npm run test:track
          npm run test:walkqueue
          npm run test:why
      # Anadil ekseninin kapısı. Buradaki hata sessiz: anlam yanlış dilde
      # gelince uygulama çalışmaya devam eder, yalnız kullanıcı anlamadığı
      # dilde soru görür. En kritik kural sınanıyor — karşılık yoksa Türkçeye
      # DÜŞÜLMEZ, kelime turdan çıkar.
      - name: Anadil ekseni
        run: npm run test:gloss
      # Yaş derecelendirmesi beyanı ↔ içerik. App Store anketine verilen her cevap
      # bir BEYAN ve beyan verildiği an içerik üretiminin sınırı oluyor. Kapı
      # olmadan bu sınır yalnız bir belgede yazılı kalır ve konuşma yazan kişi o
      # belgeyi okumaz: "cinsel içerik yok" diyen uygulamaya öyle bir metin
      # eklendiğinde beyan sessizce yalan olur. Kurulurken üç yanlış eşleşme
      # yakaladı ve düzeltti (`weinen`≠Wein, `Wetter`≠Wette, `intimidating`≠intim),
      # bir de yanlış dost: "Vierte Gewalt" basın demek, şiddet değil.
      - name: Yaş derecelendirmesi
        run: npm run check:age-rating
      # Lig kapanışının kuralları: kaç kişi yükselir/düşer ve kimin akıbeti ne.
      # Bu kapı zamanlama yüzünden var — kapanış YALNIZ pazartesi, yalnız
      # veritabanıyla ve yalnız bir haftalık veri birikmişken çalışıyor, yani
      # yanlış bir kural elle denenerek görülemez; bir hafta sonra gerçek
      # kullanıcıların tablosunda görülür ve geri alınamaz.
      - name: Lig kuralları
        run: npm run test:league
      # Yönetim ve işletim katmanının saf kuralları: uygulama denetimi
      # ayrıştırıcısı (bozuk değer herkesi güncelleme ekranına kilitleyebilir),
      # sürüm başlığı, hata gruplama/temizleme, nginx ayrıştırıcıları (bozulursa
      # 5xx uyarısı hiç tetiklenmez), toplu bildirim yolu, mağaza defteri.
      - name: Yönetim kuralları
        run: npm run test:admin
      # Sözlük kapısı + ham metin kapısı. Birincisi üç dilin anahtar kümesini ve
      # yer tutucularını karşılaştırıyor; ikincisi sözlüğe HİÇ GİRMEMİŞ Türkçe
      # metni sayıyor (cırcırlı taban, yalnız aşağı iner). İkincisi olmadan
      # doğrulama e-postası, Patika başlıkları ve AI kapalıyken çıkan geri
      # bildirim aylarca Türkçe kaldı ve hiçbir denetim bunu söylemedi.
      - name: i18n kapısı
        run: npm run i18n:check
      # Hukuki metinlerin kapısı. Buradaki hata sınıfı derlemeyi kırmıyor,
      # yayımlanmış metni okuyan biri fark ediyor: elle iki yerde artırılan
      # sürüm numarası, bir dile eklenip ötekine eklenmeyen kayıt maddesi,
      # tabloda boş kalan hücre, sayfası olmayan yol (biri App Store'un
      # Support URL alanına giriyor).
      - name: Hukuki metinler
        run: npm run test:legal
      # Web Push abonelik adresi izin listesi. Sunucu kayıtlı adrese POST atıyor;
      # liste gevşerse kayıtlı bir kullanıcı sunucuya iç ağa istek attırabilir
      # (kör SSRF, güvenlik denetimi 2026-09-14 #7). Veritabanı istemez.
      - name: Push abonelik adresi izin listesi
        run: npm run test:push-endpoint
      # Öğrenci metni değerlendirme isteminde işaretler arasında; metin işareti
      # kapatıp istemin görev satırlarını taklit edemiyor (güvenlik denetimi
      # 2026-09-14, prompt injection). Dil modeli istemez.
      - name: İstemde öğrenci metni sınırı
        run: npm run test:prompt-fence
      # Eski alan adına (exfe.me) giden yönlendirme adresleri asıl alan adına
      # sabitleniyor; sıfırlama jetonu o alan adına gidemiyor (güvenlik denetimi
      # 2026-09-14). Veritabanı istemez.
      - name: Eski alan adı yönlendirme sabitlemesi
        run: npm run test:legacy-redirects
      # Yetki katmanının veritabanı testi — 32 doğrulama. Buradaki hata sınıfı
      # sessiz: yanlış hesaplanmış bir bitiş tarihi ya da iki kez uygulanmış bir
      # ödeme olayı kullanıcı şikâyet edene kadar görünmez, sonra da parayla
      # ilgili olduğu için geri alınması pahalıdır. Boş veritabanına bütün
      # migration'lar uygulanıp şema kodla karşılaştırılıyor: migration yazmayı
      # unutmak da burada düşüyor.
      # `test:quota` 2026-09-25 kota kuralları: sahiplenme işareti, izin verilen
      # sayıyla atomik sayım, bitirmenin `user_conversations`ten okunması ve yürüyüş
      # turunun çift istek koruması — hepsi koşullu SQL, eşzamanlı isteklerle.
      # `test:store-trial` grup kodu (2 ay ücretsiz mağaza denemesi): talebin hak
      # sayacı yarışı, hesap başına tek deneme, iOS'un reddi (3.1.1) ve webhook
      # hunisinin damgaları — hepsi koşullu SQL, yalnız gerçek veritabanında görünür.
      # `test:legal-db` de burada: hukuki metinler artık panelden düzenleniyor ve
      # o yolun her adımı yayına çıkmış bir sözleşme sayfasını değiştiriyor —
      # bozuk girdinin geri çevrildiği, "varsayılana dön"ün gerçekten döndüğü ve
      # boş bir gövdenin sayfayı boşaltmadığı veritabanı olmadan sınanamıyor.
      # `test:consent` yapay zekâ rızasının kapısı: izin yoksa metin ve ses
      # sağlayıcıya gitmiyor (App Store 5.1.2(i), Play Kullanıcı Verileri). Söz
      # SQL'de tutuluyor ya da tutulmuyor — eklemeli defterin son kararı ve
      # gecikmeli değerlendirme kuyruğunun izin süzgeci ancak burada sınanıyor.
      # `test:push-sql` hatırlatma turunun ham SQL'i: Drizzle'ın dizi açılımı
      # sorguyu yalnız Postgres'te bozuyordu ve cron dört akşam 500 döndü.
      # `test:guest-merge` misafirin hesaba birleşmesi: her tablonun kuralı bir
      # SQL cümlesi, yanlış sütun ya da unutulmuş çakışma yalnız burada görünür.
      # `test:guest-resume` çerezini kaybeden misafirin oturumunu jetonla geri
      # kuran Better Auth ucu: işleyici gerçek oturum tablosunda koşuyor.
      # `test:guest-upgrade` misafirin yerinde hesaba dönmesi; iki kez: SMTP'siz
      # (hemen hesap) ve SMTP'li (doğrulanana dek misafir, doğrulama çerezi tazeliyor).
      # `test:guest-attestation` misafir açılışında Play Integrity kayıt kipi:
      # Google çağrısı sahte, kanca ve tablo gerçek; hiçbir sonuç misafiri
      # reddetmiyor, kip kapalıyken satır yazılmıyor, hesap silmede kimlik boşalıyor.
      # `test:verify-session` doğrulama bağlantısının açık bir oturumu (hesap ya da
      # misafir) başka bir hesaba geçirmediği: bağlantıyla oturum dayatma.
      - name: Yetki ve hukuki metin (veritabanı)
        run: |
          npx tsx scripts/migrate-all.ts
          npx tsx scripts/schema-check.ts
          npm run test:entitlement
          npm run test:quota
          npm run test:store-trial
          npm run test:consent
          npm run test:push-sql
          npm run test:guest-merge
          BETTER_AUTH_SECRET=ci-guest-resume-secret-0123456789abcdef BETTER_AUTH_URL=http://localhost:3000 npm run test:guest-resume
          BETTER_AUTH_SECRET=ci-guest-resume-secret-0123456789abcdef BETTER_AUTH_URL=http://localhost:3000 npm run test:guest-upgrade
          SMTP_HOST=127.0.0.1 SMTP_PORT=9 SMTP_USER=ci SMTP_PASS=ci BETTER_AUTH_SECRET=ci-guest-resume-secret-0123456789abcdef BETTER_AUTH_URL=http://localhost:3000 npm run test:guest-upgrade
          BETTER_AUTH_SECRET=ci-guest-resume-secret-0123456789abcdef BETTER_AUTH_URL=http://localhost:3000 npm run test:verify-session
          BETTER_AUTH_SECRET=ci-guest-resume-secret-0123456789abcdef BETTER_AUTH_URL=http://localhost:3000 npm run test:guest-attestation
          npm run test:legal-db
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/lernomi_test
          TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/lernomi_test
      # Next'in derleme önbelleği. Önbellek yokken `next build` CI'da "No build
      # cache found" uyarısı basıyor ve her derlemeyi sıfırdan yapıyordu.
      # Anahtar kilit dosyası + kaynak; kaynak değişince aynı kilit dosyasının
      # en yakın önbelleği geri yükleniyor (Next'in önerdiği düzen). İlk koşu
      # önbelleği kuruyor, sonrakiler onu kullanıyor. Son yedek anahtar kilit
      # dosyasından bağımsız: bağımlılık ya da sürüm değişiminde de önceki
      # önbellekten başlıyor. Next bayat kayıtları kendisi doğruluyor; o anahtar
      # olmadan kilidin her değişiminde soğuk derleme ve aynı uyarı dönüyordu.
      - name: Derleme önbelleği
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-
      - name: next build
        run: npx next build
        env:
          # Derleme sırasında veritabanına gidilmiyor; sırlar gerekmez.
          NEXT_TELEMETRY_DISABLED: "1"

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: mobile/package.json
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - working-directory: mobile
        run: npm ci
      - name: TypeScript
        working-directory: mobile
        run: npx tsc --noEmit
      # Eşik 0: mobil lint 2fff5cb5'te sıfırlandı (üç kural gerekçesiyle
      # kapatıldı, kalanı düzeltildi). 9999 kalsaydı kapı kapı olmaktan çıkardı —
      # yeni bir uyarı fark edilmeden birikirdi.
      #
      # Mobil ESLint 9 + mobile/eslint.config.js (düz yapılandırma). ESLint 9
      # yapılandırmayı çalıştığı dizinden yukarı arıyor; mobile/ içinde koşunca
      # depo kökündeki eslint.config.mjs'e ulaşmıyor. ESLint 8 döneminin
      # ESLINT_USE_FLAT_CONFIG=false bayrağı bu yüzden kalktı.
      - name: ESLint
        working-directory: mobile
        run: npx eslint src App.tsx --max-warnings 0
      # Çeviri katmanını atlayan yeni Türkçe dizgi girmesin (cırcırlı taban).
      - name: i18n kapısı
        working-directory: mobile
        run: node scripts/i18n-scan.js --check
      # iOS paketinin elle tutulan yerleri: sürüm üçlüsü, ikon ölçüleri, .strings,
      # dil beyanı, pbxproj bütünlüğü. Hiçbiri macOS istemiyor ve hiçbirini
      # ios-build.yml yakalamıyor — o simülatöre imzasız derliyor, bu sınıf ancak
      # App Store'a yüklerken patlıyor. Saniyeler sürüyor, pahalı işten önce düşsün.
      - name: iOS paket denetimi
        working-directory: mobile
        run: npm run ios:check
      # `nativeContent` testi anadil sözlüğünü KAYNAKTAN okuyor:
      # src/lib/conversations/generated/native-{en,de}.json. Dosyalar depoda yok
      # (.gitignore) ve web job'u onları kendi makinesinde üretiyor; bu job
      # üretmeyince test ENOENT ile düşüyordu. Üretici betiklerin hiçbir npm
      # bağımlılığı yok, kök `npm ci` gerekmiyor.
      - name: Üretilen içerik
        run: |
          npm run conversations:apply
          npm run conversations:apply-de
      - name: Jest
        working-directory: mobile
        run: npx jest --silent
