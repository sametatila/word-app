<title>Lernomi video çıktısı</title>
<style>/*FONTS*/</style>
<style>html,body{margin:0;background:#000;overflow:hidden}#host{position:fixed;left:0;top:0;width:1080px;height:1920px}</style>
<div id="host"></div>
<script>/*ENGINE*/</script>
<script>/*DATA*/</script>
<script>/*VIDEOS*/</script>
<script>
// Kare kare dışa aktarma: render.mjs window.I.render(t) çağırıp ekran görüntüsü alır, sesi window.wav() ile çeker.
(async () => {
  await Promise.all(["800 100px 'Bricolage Grotesque'", "700 100px 'Bricolage Grotesque'", "600 100px 'Bricolage Grotesque'", "500 100px 'DM Mono'"].map((f) => document.fonts.load(f, "ÄÖÜäöüßğışçİ")));
  try {
    window.I = E.mount(document.getElementById("host"), E.TEMPLATE);
  } catch (e) {
    window.FAILED = e.message; // renderVideo hemen hata versin, 60 sn beklemesin
    return;
  }
  /** Ses izi → 16 bit PCM WAV, base64. */
  window.wav = async (noMusic = false) => {
    const plan = window.I.plan;
    const buf = await E.soundtrack(noMusic ? { ...plan, music: { ...plan.music, gain: 0 } } : plan);
    const n = buf.length;
    const ch = [buf.getChannelData(0), buf.getChannelData(1)];
    const out = new DataView(new ArrayBuffer(44 + n * 4));
    const str = (o, s) => [...s].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
    str(0, "RIFF"); out.setUint32(4, 36 + n * 4, true); str(8, "WAVEfmt "); out.setUint32(16, 16, true);
    out.setUint16(20, 1, true); out.setUint16(22, 2, true); out.setUint32(24, buf.sampleRate, true);
    out.setUint32(28, buf.sampleRate * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true);
    str(36, "data"); out.setUint32(40, n * 4, true);
    for (let i = 0, o = 44; i < n; i++) for (let c = 0; c < 2; c++, o += 2) out.setInt16(o, Math.max(-1, Math.min(1, ch[c][i])) * 32767, true);
    const bytes = new Uint8Array(out.buffer);
    let s = "";
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s);
  };
  window.READY = true;
})();
</script>
