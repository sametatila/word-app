buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Firebase Cloud Messaging (uzak bildirim). Eklenti YALNIZ
        // app/google-services.json varsa uygulanıyor (bkz. app/build.gradle):
        // dosya olmadan uygulanırsa yapı çöker ve anahtarları olmayan bir
        // geliştirici hiçbir şey derleyemez.
        classpath("com.google.gms:google-services:4.4.2")
        // Crashlytics (native çökme + ANR raporu, ücretsiz). google-services ile
        // aynı koşula bağlı: dosya yoksa uygulanmıyor (bkz. app/build.gradle).
        classpath("com.google.firebase:firebase-crashlytics-gradle:3.0.3")
    }
}

apply plugin: "com.facebook.react.rootproject"
